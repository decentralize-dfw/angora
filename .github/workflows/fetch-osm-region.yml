# Fetches the Bölge plan's raw material - every road, building and landuse
# polygon within 2.7 km of the villa - from OpenStreetMap's Overpass API.
# This runs on GitHub's runners because the development environment's egress
# proxy blocks the OSM servers. Dispatch it by hand; it commits the gzipped
# extract to the working branch for tools/extract_region_streets_r45.mjs.
name: Fetch OSM region data
# The integration token cannot POST workflow_dispatch (403), so the trigger
# is a push that touches the request marker below.
on:
  workflow_dispatch:
  push:
    branches: [claude/sweet-thompson-amqghq]
    paths: ['tools/osm-fetch-request.txt']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/sweet-thompson-amqghq
      - name: Query Overpass
        run: |
          set -euo pipefail
          # One combined query 504'd on the main endpoint and came back empty
          # from the fallback, so the load is split - streets and landuse in
          # one request, the heavy building set in another - and an endpoint
          # only counts when it actually returns elements.
          fetch() {
            local q="$1" out="$2" n ep
            for ep in https://overpass-api.de/api/interpreter \
                      https://overpass.kumi.systems/api/interpreter \
                      https://overpass.private.coffee/api/interpreter; do
              echo "-> $ep"
              if curl -sS --fail -m 260 --data-urlencode "data=$q" "$ep" -o "$out"; then
                n=$(jq '.elements|length' "$out" 2>/dev/null || echo 0)
                echo "   elements: $n"
                [ "$n" -gt 0 ] && return 0
                head -c 300 "$out"; echo
              fi
              sleep 12
            done
            echo "no endpoint returned elements for this query"; return 1
          }
          STREETS='[out:json][timeout:180][maxsize:1073741824];(
            way(around:2700,39.87021694,32.71868652)["highway"~"^(motorway|trunk|primary|secondary|tertiary|unclassified|residential|living_street|pedestrian|service|track)"];
            way(around:2700,39.87021694,32.71868652)["landuse"];
            way(around:2700,39.87021694,32.71868652)["leisure"~"^(park|pitch|garden|playground)$"];
            way(around:3000,39.87021694,32.71868652)["name"~"Angora",i];
            relation(around:3000,39.87021694,32.71868652)["name"~"Angora",i];
          );out geom;'
          BUILDINGS='[out:json][timeout:180][maxsize:1073741824];way(around:2700,39.87021694,32.71868652)["building"];out geom;'
          fetch "$STREETS" streets.json
          fetch "$BUILDINGS" buildings.json
          jq -c -s '{fetched:(now|todate),elements:[(.[0].elements[],.[1].elements[])|{
              t:.type,
              tags:((.tags//{})|{highway,building,landuse,leisure,name,place,boundary}|with_entries(select(.value!=null))),
              geometry:(.geometry//null),
              members:(if .members then [.members[]|{role,geometry:(.geometry//null)}] else null end)
            }]}' streets.json buildings.json > trimmed.json
          gzip -9 -c trimmed.json > tools/osm-region.json.gz
          echo "streets: $(wc -c < streets.json) B, buildings: $(wc -c < buildings.json) B, trimmed: $(wc -c < trimmed.json) B, gz: $(wc -c < tools/osm-region.json.gz) B"
          jq '.elements|length' trimmed.json
      - name: Commit the extract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/osm-region.json.gz
          git diff --cached --quiet && { echo "extract unchanged"; exit 0; }
          git commit -m "Add the OSM extract for the Bölge plan (roads, buildings, landuse)

          Fetched from Overpass on a GitHub runner because the development
          environment cannot reach the OSM servers directly.

          Co-Authored-By: Claude Fable 5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_01QTnZ17rArnAzDd3jvRyoe9"
          git push origin claude/sweet-thompson-amqghq
